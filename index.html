<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>骨格検知 - MediaPipe Pose</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --line: #2a3441;
    --accent: #4fd1c5;
    --accent2: #ff8a5b;
    --text: #e6edf3;
    --text-dim: #8b96a3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
  }
  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.02em;
  }
  h1 span { color: var(--accent); }
  .status {
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #3a4552;
    transition: background 0.2s;
  }
  .dot.ready { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .dot.running { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); }

  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  video, canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1); /* 鏡像表示 */
  }
  video { opacity: 1; }

  .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    color: var(--text-dim);
    font-size: 14px;
    text-align: center;
    padding: 20px;
  }

  .controls {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    padding: 10px 18px;
    border-radius: 7px;
    font-size: 14px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary {
    background: var(--accent);
    color: #06201d;
    border-color: var(--accent);
    font-weight: 600;
  }
  button.primary:hover:not(:disabled) { background: #5fe0d3; }

  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin-top: 20px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .card .label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
  .card .value { font-size: 18px; font-variant-numeric: tabular-nums; }

  .note {
    margin-top: 18px;
    font-size: 12.5px;
    line-height: 1.7;
    color: var(--text-dim);
  }
  .note code {
    background: var(--panel);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 12px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>骨格検知 <span>/ MediaPipe Pose</span></h1>
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">初期化前</span></div>
  </header>

  <div class="stage" id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="placeholder" id="placeholder">
      「カメラ開始」を押すとWebカメラ映像上に骨格(ランドマーク)を描画します
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="startBtn">カメラ開始</button>
    <button id="stopBtn" disabled>停止</button>
  </div>

  <div class="info-grid">
    <div class="card"><div class="label">検出人数</div><div class="value" id="personCount">-</div></div>
    <div class="card"><div class="label">FPS</div><div class="value" id="fps">-</div></div>
    <div class="card"><div class="label">平均信頼度</div><div class="value" id="confidence">-</div></div>
    <div class="card"><div class="label">モデル</div><div class="value" id="modelName" style="font-size:13px">Pose Landmarker Lite</div></div>
  </div>

  <div class="note">
    MediaPipe Tasks Vision（<code>@mediapipe/tasks-vision</code>）の PoseLandmarker をブラウザ内で実行しています。映像は外部送信されずローカルで処理されます。カメラアクセスの許可が必要です。
  </div>
</div>

<script type="module">
import {
  PoseLandmarker,
  FilesetResolver,
  DrawingUtils
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const placeholder = document.getElementById('placeholder');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const personCountEl = document.getElementById('personCount');
const fpsEl = document.getElementById('fps');
const confidenceEl = document.getElementById('confidence');

let poseLandmarker = null;
let drawingUtils = null;
let running = false;
let stream = null;
let lastVideoTime = -1;
let frameCount = 0;
let lastFpsTime = performance.now();

function setStatus(mode, text) {
  statusDot.className = 'dot' + (mode ? ' ' + mode : '');
  statusText.textContent = text;
}

async function initPoseLandmarker() {
  setStatus('running', 'モデル読み込み中...');
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numPoses: 2
  });
  drawingUtils = new DrawingUtils(ctx);
  setStatus('ready', 'モデル準備完了');
}

async function startCamera() {
  startBtn.disabled = true;
  try {
    if (!poseLandmarker) {
      await initPoseLandmarker();
    }
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480, facingMode: 'user' },
      audio: false
    });
    video.srcObject = stream;
    await new Promise(res => { video.onloadedmetadata = res; });
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    placeholder.style.display = 'none';
    running = true;
    stopBtn.disabled = false;
    setStatus('running', '検出中');
    frameCount = 0;
    lastFpsTime = performance.now();
    requestAnimationFrame(detectLoop);
  } catch (err) {
    setStatus('', 'エラー: ' + err.message);
    startBtn.disabled = false;
    console.error(err);
  }
}

function stopCamera() {
  running = false;
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  placeholder.style.display = 'flex';
  startBtn.disabled = false;
  stopBtn.disabled = true;
  personCountEl.textContent = '-';
  fpsEl.textContent = '-';
  confidenceEl.textContent = '-';
  setStatus('ready', '停止中');
}

function detectLoop() {
  if (!running) return;

  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const startTimeMs = performance.now();
    const result = poseLandmarker.detectForVideo(video, startTimeMs);

    ctx.save();
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let totalConf = 0, confCount = 0;

    if (result.landmarks && result.landmarks.length > 0) {
      for (const landmarks of result.landmarks) {
        drawingUtils.drawLandmarks(landmarks, {
          radius: (data) => DrawingUtils.lerp(data.from?.z ?? 0, -0.15, 0.1, 5, 1),
          color: '#4fd1c5',
          fillColor: '#4fd1c5'
        });
        drawingUtils.drawConnectors(
          landmarks,
          PoseLandmarker.POSE_CONNECTIONS,
          { color: '#ff8a5b', lineWidth: 3 }
        );
        for (const lm of landmarks) {
          if (lm.visibility !== undefined) {
            totalConf += lm.visibility;
            confCount++;
          }
        }
      }
      personCountEl.textContent = result.landmarks.length;
      confidenceEl.textContent = confCount > 0
        ? Math.round((totalConf / confCount) * 100) + '%'
        : '-';
    } else {
      personCountEl.textContent = '0';
      confidenceEl.textContent = '-';
    }
    ctx.restore();

    frameCount++;
    const now = performance.now();
    if (now - lastFpsTime >= 1000) {
      fpsEl.textContent = Math.round((frameCount * 1000) / (now - lastFpsTime));
      frameCount = 0;
      lastFpsTime = now;
    }
  }

  requestAnimationFrame(detectLoop);
}

startBtn.addEventListener('click', startCamera);
stopBtn.addEventListener('click', stopCamera);

setStatus('', '「カメラ開始」を押してください');
</script>
</body>
</html>
